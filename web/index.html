<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Distributed matrix multiplication across phones and desktops on a local network.">
  <link rel="manifest" href="/static/manifest.json">
  <title>Distibuted Matrix</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="header-left">
      <h1>Distributed Matrix Multiplication</h1>
      <span class="subtitle">Distributed Matrix Multiplication</span>
    </div>
    <span id="conn-status" class="badge badge-connecting">Connecting...</span>
  </header>

  <!-- My Node Metrics Panel -->
  <section class="card" id="metrics-panel">
    <h2>My Node Contribution</h2>
    <div class="metrics-grid">
      <div class="metric">
        <label>Node ID</label>
        <span id="m-node_id">—</span>
      </div>
      <div class="metric">
        <label>Status</label>
        <span id="m-status">Connecting...</span>
      </div>
      <div class="metric">
        <label>Current Job</label>
        <span id="m-job_id">—</span>
      </div>
      <div class="metric">
        <label>Last Block</label>
        <span id="m-last_block">—</span>
      </div>
      <div class="metric">
        <label>Compute Time</label>
        <span id="m-compute_time">—</span>
      </div>
      <div class="metric">
        <label>MFLOPS</label>
        <span id="m-mflops">—</span>
      </div>
      <div class="metric">
        <label>Operations</label>
        <span id="m-operations">—</span>
      </div>
      <div class="metric">
        <label>Rows Processed</label>
        <span id="m-rows_done">—</span>
      </div>
    </div>
    <div class="device-info">
      <span id="m-device" class="device-tag">—</span>
    </div>
  </section>

  <!-- Matrix Input Panel -->
  <section class="card" id="input-panel">
    <h2>Submit Matrix Job</h2>

    <div class="matrix-section">
      <!-- Matrix A -->
      <div class="matrix-block">
        <label class="matrix-label">Matrix A</label>
        <div class="dim-controls">
          <input type="number" id="rowsA" value="3" min="2" max="200" oninput="UI.syncDim()">
          <span class="dim-sep">×</span>
          <input type="number" id="colsA" value="3" min="2" max="200" oninput="UI.syncDim()">
          <button class="btn-sm" onclick="UI.buildGrid('A')">Build Grid</button>
        </div>
        <div id="grid-A" class="matrix-grid"></div>
      </div>

      <div class="times-sign">×</div>

      <!-- Matrix B -->
      <div class="matrix-block">
        <label class="matrix-label">Matrix B</label>
        <div class="dim-controls">
          <input type="number" id="rowsB" value="3" min="2" max="200" readonly>
          <span class="dim-sep">×</span>
          <input type="number" id="colsB" value="3" min="2" max="200" oninput="UI.buildGrid('B')">
          <button class="btn-sm" onclick="UI.buildGrid('B')">Build Grid</button>
        </div>
        <div id="grid-B" class="matrix-grid"></div>
      </div>
    </div>

    <div class="actions">
      <button id="btn-run" class="btn-primary" onclick="UI.submit()">▶ Run Distributed Multiply</button>
      <button class="btn-secondary" onclick="UI.fillRandom()">🎲 Fill Random</button>
      <button class="btn-secondary" onclick="UI.setSize(5,5)">5×5</button>
      <button class="btn-secondary" onclick="UI.setSize(10,10)">10×10</button>
      <button class="btn-secondary" onclick="UI.setSize(50,50)">50×50</button>
      <button class="btn-secondary" onclick="UI.setSize(100,100)">100×100</button>
    </div>

    <div id="submit-feedback" class="submit-feedback"></div>
  </section>

  <!-- Result Panel -->
  <section class="card">
    <h2>Result</h2>
    <div id="result-area">
      <p class="muted">No result yet. Submit a job above.</p>
    </div>
  </section>

  <!-- Log Panel -->
  <section class="card">
    <h2>Node Log</h2>
    <pre id="log" class="log-box">Waiting for connection...</pre>
  </section>

</div><!-- /#app -->

<script src="/static/app.js"></script>
<script>
// ── UI Controller ─────────────────────────────────────────────────────────────
const UI = (() => {
  let isSubmitting = false;

  // Keep rows of B in sync with cols of A
  function syncDim() {
    const colsA = parseInt(document.getElementById("colsA").value) || 3;
    document.getElementById("rowsB").value = colsA;
  }

  function setSize(rows, cols) {
    document.getElementById("rowsA").value = rows;
    document.getElementById("colsA").value = cols;
    document.getElementById("rowsB").value = cols;
    document.getElementById("colsB").value = cols;
    syncDim();
    clearFeedback();
    if (rows <= 12 && cols <= 12) {
      buildGrid("A");
      buildGrid("B");
      fillRandom();
    } else {
      document.getElementById("grid-A").innerHTML =
        `<p class="muted grid-note">Grid hidden for ${rows}×${cols} — values auto-generated on submit.</p>`;
      document.getElementById("grid-B").innerHTML =
        `<p class="muted grid-note">Grid hidden for ${rows}×${cols} — values auto-generated on submit.</p>`;
    }
  }

  function buildGrid(id) {
    const rows = parseInt(document.getElementById(`rows${id}`).value) || 3;
    const cols = parseInt(document.getElementById(`cols${id}`).value) || 3;
    const container = document.getElementById(`grid-${id}`);
    container.innerHTML = "";

    if (rows > 15 || cols > 15) {
      container.innerHTML =
        `<p class="muted grid-note">Grid hidden (${rows}×${cols} too large). Values auto-generated on submit.</p>`;
      return;
    }

    for (let r = 0; r < rows; r++) {
      const rowEl = document.createElement("div");
      rowEl.className = "matrix-row";
      for (let c = 0; c < cols; c++) {
        const inp = document.createElement("input");
        inp.type = "number"; inp.value = "0"; inp.className = "cell-input";
        inp.step = "0.1";
        rowEl.appendChild(inp);
      }
      container.appendChild(rowEl);
    }
  }

  function getMatrix(id) {
    const container = document.getElementById(`grid-${id}`);
    const rows = container.querySelectorAll(".matrix-row");
    if (!rows.length) return null;
    return Array.from(rows).map(row =>
      Array.from(row.querySelectorAll("input")).map(i => parseFloat(i.value) || 0)
    );
  }

  function fillRandom() {
    ["A", "B"].forEach(id => {
      const inputs = document.getElementById(`grid-${id}`).querySelectorAll("input");
      inputs.forEach(inp => {
        inp.value = (Math.random() * 20 - 10).toFixed(2);
      });
    });
  }

  function randomMatrix(rows, cols) {
    // Raw numbers — no toFixed/parseFloat overhead for speed
    return Array.from({ length: rows }, () =>
      Array.from({ length: cols }, () => Math.round((Math.random() * 20 - 10) * 100) / 100)
    );
  }

  function clearFeedback() {
    const fb = document.getElementById("submit-feedback");
    if (fb) { fb.textContent = ""; fb.className = "submit-feedback"; }
  }

  async function submit() {
    if (isSubmitting) return;  // prevent double-clicks

    const rA = parseInt(document.getElementById("rowsA").value);
    const cA = parseInt(document.getElementById("colsA").value);
    const rB = parseInt(document.getElementById("rowsB").value);
    const cB = parseInt(document.getElementById("colsB").value);

    // Enforce dimension sync
    if (cA !== rB) {
      document.getElementById("rowsB").value = cA;
    }

    let A = getMatrix("A");
    let B = getMatrix("B");

    if (!A) A = randomMatrix(rA, cA);
    if (!B) B = randomMatrix(rB, cB);

    const feedback = document.getElementById("submit-feedback");
    const btn      = document.getElementById("btn-run");

    // Client-side dimension check
    if (A[0].length !== B.length) {
      feedback.textContent = `❌ Dimension mismatch: A has ${A[0].length} columns, B has ${B.length} rows.`;
      feedback.className = "submit-feedback error";
      return;
    }

    // Lock UI
    isSubmitting = true;
    btn.classList.add("is-loading");
    btn.disabled = true;
    feedback.textContent = "⏳ Submitting job...";
    feedback.className = "submit-feedback info";

    try {
      const data = await App.submitJob(A, B);

      if (data && data.job_id) {
        feedback.textContent = `✅ Job ${data.job_id.slice(0, 8)} is running. Waiting for result...`;
        feedback.className = "submit-feedback success";
      } else if (data && data.error) {
        feedback.textContent = `❌ ${data.error}`;
        feedback.className = "submit-feedback error";
      }
    } catch (e) {
      feedback.textContent = `❌ Network error: ${e.message}`;
      feedback.className = "submit-feedback error";
    } finally {
      isSubmitting = false;
      btn.classList.remove("is-loading");
      btn.disabled = false;
    }
  }

  // Build default grids on load
  window.addEventListener("DOMContentLoaded", () => {
    buildGrid("A");
    buildGrid("B");
    syncDim();
  });

  return { syncDim, setSize, buildGrid, fillRandom, submit };
})();
</script>
</body>
</html>
